name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref. Without this, a busy branch
  # queues runs that are already answering an obsolete question.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the migrations create a vector column and an HNSW
        # index, and plain postgres:16 would fail at migrate with a confusing type error.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: newsintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: System checks
        run: python manage.py check --deploy --fail-level WARNING || python manage.py check

      # Migration drift is the classic silent breakage: a model field edited without a
      # migration passes every test locally against an already-migrated database, then
      # fails on a fresh deploy where the column does not exist.
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - run: pytest -q
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly the lockfile. `npm install` may resolve a different
      # minor version than the one this build validated, which makes CI green for an
      # artifact that is not the artifact being deployed.
      - run: npm ci
      - run: npm run build
