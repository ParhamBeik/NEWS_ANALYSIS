name: Deploy

# GATED ON CI, not on the push.
#
# This used to trigger on `push: branches: [main]`, which meant CI and Deploy started at the
# same instant and raced. A commit whose tests failed still shipped, because nothing
# connected the two - the red X appeared next to a release that was already serving users.
# `workflow_run` is the only trigger that waits for another workflow to finish.
#
# GitHub always takes the workflow_run definition from the DEFAULT BRANCH, so this file
# governs deploys of every commit regardless of where it was authored.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to this commit). Use a previous SHA to roll back."
        required: false

concurrency:
  # NEVER cancel a deploy in progress. Two `docker compose up` runs against the same host
  # can interleave into a half-migrated stack; queueing is the only safe behaviour.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # The gate. A manual dispatch is always allowed - that is the rollback path, and it must
    # keep working when CI is red, because a red CI is exactly when you need to roll back.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      image_base: ${{ steps.tag.outputs.image_base }}
    strategy:
      # Backend and frontend build in parallel; a failure in one should still surface the
      # other's result rather than hiding it behind a cancelled job.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      # The commit CI actually tested, not whatever main points at now. Under workflow_run
      # those can differ: a second push while CI was running moves the branch, and building
      # the newer commit would ship code no test ever saw.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: |
          echo "value=${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          # Docker refuses a repository name containing uppercase, and this repository is
          # `ParhamBeik/NEWS_ANALYSIS`. `github.repository` cannot be lowercased in an
          # expression, so it has to happen in the shell.
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a PAT: it is scoped to this repository and expires with the
          # job, so a leaked workflow log cannot be replayed against the registry later.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          # Both an immutable SHA tag and `latest`. The SHA is what actually gets deployed
          # and what a rollback re-pins to; `latest` exists only so a manual
          # `docker compose pull` on the VPS does something reasonable.
          tags: |
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key, not `StrictHostKeyChecking=no`. Blindly accepting whatever
          # answers on port 22 means a DNS or routing change silently hands the deploy
          # key and the whole stack to a different machine.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # backup.sh ships with the compose file because the `backup` service bind-mounts it
      # from the host. A compose file that names a script the host does not have is a
      # service that restart-loops on "no such file", which on a backup job means no
      # backups and no obvious symptom.
      - name: Ship compose files
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/docker-compose.prod.yml \
            deploy/backup.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/news-intel/deploy/

      # Written BEFORE anything changes, because a rollback target you record after the fact
      # is the broken version. `.rollback` is the only record of what was serving; nothing
      # else on the box remembers the previous tag once .env has been rewritten.
      - name: Record the version currently serving
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -euo pipefail <<'EOF'
            cd /opt/apps/news-intel/deploy
            touch .env
            {
              grep '^BACKEND_IMAGE='  .env || true
              grep '^FRONTEND_IMAGE=' .env || true
            } > .rollback
            echo "will roll back to:"
            cat .rollback
          EOF

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -euo pipefail <<EOF
            cd /opt/apps/news-intel/deploy

            # Log in to GHCR on the host. The package is private, so a bare pull would 401.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pin the exact images this run built. Writing them into .env rather than
            # passing them inline means a later manual 'docker compose up -d' on the box
            # brings up the SAME version, instead of silently drifting to :latest.
            sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d' .env
            echo "BACKEND_IMAGE=${{ needs.build.outputs.image_base }}-backend:${{ needs.build.outputs.tag }}" >> .env
            echo "FRONTEND_IMAGE=${{ needs.build.outputs.image_base }}-frontend:${{ needs.build.outputs.tag }}" >> .env

            docker compose -f docker-compose.prod.yml pull
            # 'up -d' recreates only what changed. The 'migrate' service is a one-shot that
            # the app services wait on via service_completed_successfully, so schema changes
            # land before anything serves them.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Dangling images only (no -a). The previous release stays TAGGED, so it is never
            # a prune candidate and is always there to roll back to. Removing -a is the whole
            # point: 'prune -a' would delete the last working image to save disk.
            docker image prune -f
          EOF

      - name: Verify the deploy actually serves
        id: verify
        run: |
          # Poll rather than sleep-and-hope: gunicorn plus migrations can take 30s, and a
          # fixed sleep either wastes time or reports success before the app is up.
          #
          # Two URLs, not one. /login proved only that Next was answering, which is how a
          # broken sign-out and any /ops or /kpi regression shipped green. /ops is behind the
          # login gate, so 307 is the correct healthy answer - a 500 there means the
          # dashboard blew up and must not stay deployed.
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ secrets.NEWS_DOMAIN }}$1" || true)
            [ "$code" = "$2" ]
          }
          for attempt in $(seq 1 20); do
            if check /login 200 && check /ops 307; then
              echo "live after ${attempt} attempts"
              exit 0
            fi
            echo "attempt ${attempt}: not healthy yet"
            sleep 6
          done
          echo "::error::site did not pass its health checks after deploy"
          exit 1

      # Only on a failed verify. Restores the tags recorded before the switch and brings the
      # previous release back up, so production is never left on a version that did not pass.
      # Fix forward afterwards; this step buys the time to do that calmly.
      - name: Roll back to the previous version
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          echo "::warning::deploy failed its health checks - rolling back"
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -euo pipefail <<'EOF'
            cd /opt/apps/news-intel/deploy
            echo "--- why it failed ---"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=80 backend frontend

            if [ ! -s .rollback ]; then
              echo "no previous version recorded - leaving the stack as it is"
              exit 1
            fi
            echo "--- restoring ---"
            cat .rollback
            sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d' .env
            cat .rollback >> .env
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ secrets.NEWS_DOMAIN }}/login" || true)
            if [ "$code" = "200" ]; then
              echo "::notice::rolled back; the previous version is serving again"
              exit 1
            fi
            sleep 6
          done
          echo "::error::ROLLBACK ALSO FAILED - the site is down and needs a human"
          exit 1
