name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to this commit). Use a previous SHA to roll back."
        required: false

concurrency:
  # NEVER cancel a deploy in progress. Two `docker compose up` runs against the same host
  # can interleave into a half-migrated stack; queueing is the only safe behaviour.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      image_base: ${{ steps.tag.outputs.image_base }}
    strategy:
      # Backend and frontend build in parallel; a failure in one should still surface the
      # other's result rather than hiding it behind a cancelled job.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          echo "value=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
          # Docker refuses a repository name containing uppercase, and this repository is
          # `ParhamBeik/NEWS_ANALYSIS`. `github.repository` cannot be lowercased in an
          # expression, so it has to happen in the shell.
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a PAT: it is scoped to this repository and expires with the
          # job, so a leaked workflow log cannot be replayed against the registry later.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Both an immutable SHA tag and `latest`. The SHA is what actually gets deployed
          # and what a rollback re-pins to; `latest` exists only so a manual
          # `docker compose pull` on the VPS does something reasonable.
          tags: |
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key, not `StrictHostKeyChecking=no`. Blindly accepting whatever
          # answers on port 22 means a DNS or routing change silently hands the deploy
          # key and the whole stack to a different machine.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship compose files
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/news-intel/deploy/

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -euo pipefail <<EOF
            cd /opt/apps/news-intel/deploy

            # Log in to GHCR on the host. The package is private, so a bare pull would 401.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pin the exact images this run built. Writing them into .env rather than
            # passing them inline means a later manual 'docker compose up -d' on the box
            # brings up the SAME version, instead of silently drifting to :latest.
            sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d' .env
            echo "BACKEND_IMAGE=${{ needs.build.outputs.image_base }}-backend:${{ needs.build.outputs.tag }}" >> .env
            echo "FRONTEND_IMAGE=${{ needs.build.outputs.image_base }}-frontend:${{ needs.build.outputs.tag }}" >> .env

            docker compose -f docker-compose.prod.yml pull
            # 'up -d' recreates only what changed. The 'migrate' service is a one-shot that
            # the app services wait on via service_completed_successfully, so schema changes
            # land before anything serves them.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f --filter "until=168h"
          EOF

      - name: Verify the deploy actually serves
        run: |
          # Poll rather than sleep-and-hope: gunicorn plus migrations can take 30s, and a
          # fixed sleep either wastes time or reports success before the app is up.
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.NEWS_DOMAIN }}/login" || true)
            if [ "$code" = "200" ]; then
              echo "live after ${attempt} attempts"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 6
          done
          echo "::error::site did not return 200 after deploy"
          # Surface why, in the log that is about to be the only evidence.
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /opt/apps/news-intel/deploy && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=80 backend frontend'
          exit 1
