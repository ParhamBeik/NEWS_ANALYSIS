name: Deploy

# GATED ON CI, not on the push.
#
# This used to trigger on `push: branches: [main]`, which meant CI and Deploy started at the
# same instant and raced. A commit whose tests failed still shipped, because nothing
# connected the two - the red X appeared next to a release that was already serving users.
# `workflow_run` is the only trigger that waits for another workflow to finish.
#
# GitHub always takes the workflow_run definition from the DEFAULT BRANCH, so this file
# governs deploys of every commit regardless of where it was authored.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (previous SHA for rollback)."
        required: true

concurrency:
  # NEVER cancel a deploy in progress. Two `docker compose up` runs against the same host
  # can interleave into a half-migrated stack; queueing is the only safe behaviour.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # The gate. A manual dispatch is always allowed - that is the rollback path, and it must
    # keep working when CI is red, because a red CI is exactly when you need to roll back.
    # `branches: [main]` matches the head branch NAME only, so a pull request from a fork's
    # `main` also completes CI here. Only a push to this repository may ship.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      image_base: ${{ steps.tag.outputs.image_base }}
    strategy:
      # Backend and frontend build in parallel; a failure in one should still surface the
      # other's result rather than hiding it behind a cancelled job.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      # The commit CI actually tested, not whatever main points at now. Under workflow_run
      # those can differ: a second push while CI was running moves the branch, and building
      # the newer commit would ship code no test ever saw.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$REQUESTED_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag must be a commit SHA"; exit 1; }
            echo "value=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          fi
          # Docker refuses a repository name containing uppercase, and this repository is
          # `ParhamBeik/NEWS_ANALYSIS`. `github.repository` cannot be lowercased in an
          # expression, so it has to happen in the shell.
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a PAT: it is scoped to this repository and expires with the
          # job, so a leaked workflow log cannot be replayed against the registry later.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Manual rollback reuses the prior image. Rebuilding current source under an old
      # SHA would silently turn the rollback into a redeploy.
      - if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          # Both an immutable SHA tag and `latest`. The SHA is what actually gets deployed
          # and what a rollback re-pins to; `latest` exists only so a manual
          # `docker compose pull` on the VPS does something reasonable.
          tags: |
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image_base }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    needs: build
    # Same deploy half as the other three apps on this VPS. GitHub-hosted runners
    # cannot reach the VPS, so its own runner dials out and collects this job. It runs
    # as gh-runner, which has no Docker access; its one sudo right is the root-owned
    # /usr/local/sbin/app-release, which refuses a SHA not on main, checks it out in
    # /opt/apps/news-intel and runs deploy/release.sh with IMAGE_TAG=<sha>.
    runs-on: [self-hosted, vps]
    environment: production
    env:
      APP: news
      TAG: ${{ needs.build.outputs.tag }}
      PUBLIC_URL: https://news.parhambm.ir
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Recorded before anything changes: after the fact it would be the broken version.
      - name: Record the version currently serving
        id: record
        run: echo "previous=$(cat /opt/apps/news-intel/.release 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Pull images and restart
        run: printf '%s\n' "$GHCR_TOKEN" | sudo -n /usr/local/sbin/app-release "$APP" "$TAG" "${{ github.actor }}"

      # Two URLs, not one. /login proved only that Next was answering, which is how a
      # broken sign-out and any /ops or /kpi regression shipped green. /ops is behind the
      # login gate, so 307 is the correct healthy answer - a 500 there means the
      # dashboard blew up and must not stay deployed.
      - name: Smoke-test through the public edge
        run: |
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$PUBLIC_URL$1" || true)
            [ "$code" = "$2" ]
          }
          for attempt in $(seq 1 20); do
            if check /login 200 && check /ops 307; then
              echo "serving after ${attempt} attempt(s)"; exit 0
            fi
            sleep 6
          done
          echo "::error::$PUBLIC_URL did not pass its checks after deploy"; exit 1

      - name: Roll back to the previous release
        if: failure() && steps.record.outputs.previous != '' && steps.record.outputs.previous != env.TAG
        env:
          PREVIOUS: ${{ steps.record.outputs.previous }}
        run: |
          echo "::warning::deploy failed - redeploying $PREVIOUS"
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /usr/local/sbin/app-release "$APP" "$PREVIOUS" "${{ github.actor }}"
          echo "::notice::rolled back to $PREVIOUS; this run stays red"
