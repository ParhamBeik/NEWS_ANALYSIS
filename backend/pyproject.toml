[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core", "sources", "articles", "inference", "review", "market", "exports", "api"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a real external service; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings: the Persian vocabulary is the point
    "RUF002",
    "RUF003",
    "B008",    # DRF/Django idiom: callables in argument defaults
    "RUF012",  # Model/Meta class attributes are Django's declarative idiom, not shared state
    # DJ001 says "avoid null=True on string-based fields". For this codebase that advice is
    # exactly backwards on the fields that matter. An unassessed score axis MUST be NULL:
    # the empty string would be a sentinel, and substituting a sentinel for "not assessed"
    # is the bug that suppressed 0 of 488 security alerts. See core/scoring.py.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
"*/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["E501"]
