# Watch-item vocabulary: what an investor can follow, and what Jev may tag an event with.
# Loaded by `python manage.py seed_watch_items` (upsert by slug; removed rows are disabled,
# never deleted, because events keep their tags).
#
# slug: {kind: asset|actor|theme, en, fa, aliases}
# Names are matched too, so aliases only add other spellings. Matching folds Persian
# letters and digits and accepts a plural/ezafe suffix (s, ها, های, ی, ای), so list the bare
# word. Avoid aliases that are also common unrelated words (ارز is in ارزش, strike is also
# a military strike); a missed alias only costs a tag, a noisy one costs a paid question.

