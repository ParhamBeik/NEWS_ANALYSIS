{% if not rows %}
<p class="empty" style="padding:20px">No runs recorded yet.</p>
{% else %}
<table>
  <thead><tr><th>Run ID</th><th>Status</th><th class="num">Fetched</th><th class="num">Processed</th><th class="num">Cost</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td>{{ r.run_id }}</td>
      <td>{{ r.status }}</td>
      <td class="num">{{ r.articles_fetched }}</td>
      <td class="num">{{ r.articles_processed }}</td>
      <td class="num">${{ "%.4f"|format(r.cost_usd) }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
