# Local development backing services only - the app itself runs from your venv so you get
# a debugger and instant reloads.
#
# Ports are deliberately non-default (55432 / 56379): a Mac with Postgres.app or a
# Homebrew redis already owns 5432/6379 on 127.0.0.1, and Docker's bind loses that race
# silently - you connect to the wrong server and get a confusing "database does not exist".
#
#   docker compose -f deploy/docker-compose.dev.yml up -d

name: newsintel-dev

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newsintel
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devdata:
