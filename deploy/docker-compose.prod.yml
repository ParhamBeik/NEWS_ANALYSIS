name: newsintel

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0 }
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    depends_on: [db, redis]
    volumes: [media:/app/media]
  worker-crawl:
    build: ../backend
    restart: unless-stopped
    command: celery -A config.celery.app worker -Q crawl,default --loglevel=INFO --concurrency=4
    env_file: .env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0 }
    depends_on: [db, redis]
    volumes: [media:/app/media]
  worker-inference:
    build: ../backend
    restart: unless-stopped
    command: celery -A config.celery.app worker -Q inference --loglevel=INFO --concurrency=2
    env_file: .env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0 }
    depends_on: [db, redis]
    volumes: [media:/app/media]
  beat:
    build: ../backend
    restart: unless-stopped
    command: celery -A config.celery.app beat --loglevel=INFO
    env_file: .env
    environment: { DJANGO_SETTINGS_MODULE: config.settings.prod, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0 }
    depends_on: [db, redis]
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment: { API_ORIGIN: http://backend:8000 }
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  dbdata:
  media:
